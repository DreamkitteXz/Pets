org.gradle.jvmargs=-Xmx1536M
android.useAndroidX=true
android.enableJetifier=true
# Build-Tools/Platforms já estão instalados; o auto-download do AGP estava
# falhando ao gravar o install properties file. Usa o SDK já instalado.
android.builder.sdkDownload=false
# Plugins antigos fixam Java em 1.8 mas o Kotlin 2.x mira JVM 21 -> mismatch.
# Rebaixa a validação de erro p/ aviso (o D8/R8 do Android lida com bytecode misto).
kotlin.jvm.target.validation.mode=warning
# Desliga o file-system watching do Gradle: no Windows ele causava
# "Failed to create MD5 hash ... does not exist" (estado de VFS/antivírus).
org.gradle.vfs.watch=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
